name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  tox:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: 3.11
    - name: Install Deps
      run: |
        python -m pip install -U pip
        pip install tox tox-gh>=1.2 pytest flake8
    - name: Test with tox
      run: tox


  build:
    needs: tox
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag hemna6969/aprsd-exporter:$(date +%s)
